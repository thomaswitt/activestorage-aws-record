# Ruby style: Rails Omakase, with the same project overrides used across these
# projects (single-quoted strings, consistent trailing commas, tight array
# brackets). rubocop-rake lints the Rakefile and the shipped *.rake tasks.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

plugins:
  - rubocop-rake

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4
  Exclude:
    - "vendor/**/*"
    - "pkg/**/*"
    - "tmp/**/*"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: single_quotes
  Include:
    - "Gemfile"
    - "**/*.rb"
    - "**/*.rake"

Style/TrailingCommaInArrayLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Style/TrailingCommaInHashLiteral:
  Enabled: true
  EnforcedStyleForMultiline: consistent_comma

Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: no_space

Layout/TrailingEmptyLines:
  Enabled: false
